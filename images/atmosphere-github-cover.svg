<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111828"/><stop offset="1" stop-color="#263656"/></linearGradient><radialGradient id="orb" cx=".3" cy=".27" r=".9"><stop stop-color="#ffefc0"/><stop offset=".43" stop-color="#ffbd80"/><stop offset="1" stop-color="#9765ba"/></radialGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="1050" cy="110" r="270" fill="#7f89cc" opacity=".11"/><circle cx="85" cy="535" r="250" fill="#7dccd8" opacity=".08"/><g font-family="Arial,Helvetica,sans-serif" fill="#f7f8ff"><text x="68" y="93" font-size="25" font-weight="bold" letter-spacing="4">✳ ATMOSPHERE.</text><text x="69" y="194" font-size="54" font-weight="bold">Feel the forecast.</text><text x="70" y="237" font-size="22" fill="#bec8db">Not just the weather. The atmosphere around you.</text><rect x="64" y="281" width="1070" height="274" rx="30" stroke="#ffffff" stroke-opacity=".4" fill="url(#glass)"/><text x="102" y="333" font-size="16" fill="#b9e7de" letter-spacing="3">● CURRENT ATMOSPHERE</text><text x="100" y="395" font-size="43">Rome</text><text x="102" y="428" font-size="16" fill="#c6cde3">Italy · Clear skies</text><text x="102" y="509" font-size="74">23°</text><circle cx="837" cy="420" r="111" fill="#f7caac" opacity=".17"/><circle cx="837" cy="420" r="92" fill="url(#orb)" stroke="#fff2df" stroke-opacity=".65"/><g font-size="16" fill="#e6edf9"><text x="971" y="368">HUMIDITY</text><text x="971" y="393" font-size="26">42%</text><text x="971" y="452">WIND</text><text x="971" y="480" font-size="26">8 km/h</text></g><text x="68" y="604" font-size="15" letter-spacing="2" fill="#a5b9ca">LIQUID GLASS  ·  DYNAMIC AURA  ·  WEATHER MOOD</text></g></svg>